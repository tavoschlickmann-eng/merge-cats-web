html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #1a1c21;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: #1a1c21;
	visibility: hidden;
	overflow: hidden;
}

/* Arte de abertura cobrindo a tela inteira. */
#status-splash {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: cover;
	object-position: center top;
}

/* Escurece a parte de baixo para a barra aparecer bem. */
#status-shade {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	height: 38%;
	background: linear-gradient(to bottom, rgba(20, 16, 14, 0), rgba(20, 16, 14, 0.85));
}

#status-loader {
	position: absolute;
	left: 50%;
	bottom: 7%;
	transform: translateX(-50%);
	width: min(560px, 76%);
	display: none;
	text-align: center;
	font-family: 'Passion One', 'Arial Black', sans-serif;
}

#status-text {
	font-size: clamp(22px, 3.4vw, 40px);
	letter-spacing: 0.02em;
	margin-bottom: 0.35em;
	text-shadow: -3px -3px 0 #3b1d10, 3px -3px 0 #3b1d10, -3px 3px 0 #3b1d10, 3px 3px 0 #3b1d10,
		0 4px 0 #3b1d10;
}

#status-track {
	height: clamp(18px, 2.6vw, 28px);
	border-radius: 999px;
	background: #2b1a12;
	border: 4px solid #3b1d10;
	box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
	overflow: hidden;
}

#status-fill {
	height: 100%;
	width: 0%;
	border-radius: 999px;
	background: linear-gradient(to bottom, #ffd04a, #f59a1b 60%, #e07a10);
	box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.45);
	transition: width 0.25s ease-out;
}

/* Sem tamanho total conhecido: uma faixa que vai e volta. */
#status-fill.indeterminate {
	width: 35%;
	animation: slide 1.1s ease-in-out infinite alternate;
}

@keyframes slide {
	from { margin-left: 0%; }
	to { margin-left: 65%; }
}

/* Celular em pé: aviso para girar (o jogo é em paisagem e fica pausado enquanto isso). */
#rotate {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 6vh;
	background-color: #1a1c21;
	font-family: 'Passion One', 'Arial Black', sans-serif;
	text-align: center;
}

.rotate-phone {
	width: 28vw;
	height: 46vw;
	border: 2.4vw solid #f5a623;
	border-radius: 5vw;
	box-shadow: 0 0 0 1.2vw #3b1d10;
	animation: turn 2.2s ease-in-out infinite;
}

.rotate-text {
	color: #ffe066;
	font-size: 9vw;
	line-height: 1.15;
	text-shadow: -0.6vw -0.6vw 0 #3b1d10, 0.6vw -0.6vw 0 #3b1d10, -0.6vw 0.6vw 0 #3b1d10, 0.6vw 0.6vw 0 #3b1d10;
}

@keyframes turn {
	0%, 20% { transform: rotate(0deg); }
	55%, 80% { transform: rotate(-90deg); }
	100% { transform: rotate(0deg); }
}

/* Aviso menor que aparece dentro da tela de carregamento quando o celular está em pé. */
#status-hint {
	display: none;
	flex-direction: column;
	align-items: center;
	gap: 3vh;
	font-family: 'Passion One', 'Arial Black', sans-serif;
	text-align: center;
}

#status-hint .rotate-phone {
	width: 13vw;
	height: 21vw;
	border-width: 1.4vw;
	border-radius: 3vw;
	box-shadow: 0 0 0 0.8vw #3b1d10;
}

#status-hint .rotate-text {
	font-size: 6.5vw;
}

@media (orientation: portrait) and (pointer: coarse) {
	#rotate {
		display: flex;
	}

	/* Enquanto carrega, a própria tela de carregamento fica em retrato: a arte inteira (sem
	   cortar nem esticar), a barra e o aviso para girar. Depois de carregar, vale o #rotate. */
	body.loading #rotate {
		display: none;
	}

	#status {
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 6vh;
	}

	#status-splash {
		position: static;
		width: 100%;
		height: auto;
	}

	#status-shade {
		display: none;
	}

	#status-loader,
	#status-notice {
		position: static;
		transform: none;
		width: 84%;
	}

	#status-text {
		font-size: 7.5vw;
	}

	#status-track {

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":38757300,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

// Versão da publicação: o script tools/publicar_web.ps1 grava em versao.txt um código que muda
// quando o jogo muda. Ele vai no endereço do index.js, do .wasm e do .pck (?v=...), então o
// navegador baixa os arquivos novos em vez de usar os guardados no cache. O versao.txt é lido
// sempre sem cache. Sem o arquivo (exportação comum, teste local), carrega sem versão.
(function () {
	function carregarMotor(versao) {
		const sufixo = versao ? '?v=' + encodeURIComponent(versao) : '';
		if (sufixo) {
			const fetchOriginal = window.fetch.bind(window);
			window.fetch = function (recurso, opcoes) {
				if (typeof recurso === 'string' && /\.(wasm|pck)$/.test(recurso)) {
					recurso += sufixo;
				}
				return fetchOriginal(recurso, opcoes);
			};
		}
		const script = document.createElement('script');
		script.src = 'index.js' + sufixo;
		script.onload = iniciarJogo;
		script.onerror = function () {
			const aviso = document.getElementById('status-notice');
			aviso.textContent = 'Ops! Não foi possível abrir o jogo. Tente recarregar a página.';
			aviso.style.display = 'block';
			document.getElementById('status').style.visibility = 'visible';
		};
		document.body.appendChild(script);
	}

	fetch('versao.txt', { cache: 'no-store' })
		.then((resposta) => (resposta.ok ? resposta.text() : ''))
		.then((texto) => texto.trim(), () => '')
		.then(carregarMotor);
}());

// Tela cheia no celular/tablet: entra sozinha no primeiro toque (o navegador só deixa pedir dentro
// de um toque) e, sempre que o jogo sai da tela cheia, aparece o botão para voltar. Em tela cheia o
// celular também trava deitado, quando o navegador permite.
(function () {
	const botao = document.getElementById('fullscreen');
	const raiz = document.documentElement;
	const toque = window.matchMedia('(pointer: coarse)').matches;
	const pedir = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
	const permitido = document.fullscreenEnabled || document.webkitFullscreenEnabled;
	if (!toque || !pedir || !permitido) {
		return;
	}
	let pediuSozinho = false;

	function emTelaCheia() {
		return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
	}

	function atualizar() {
		botao.style.display = emTelaCheia() ? 'none' : 'flex';
	}

	function entrar() {
		try {
			const pedido = pedir.call(raiz, { navigationUI: 'hide' });
			if (pedido && pedido.then) {
				pedido.then(() => {
					if (screen.orientation && screen.orientation.lock) {
						screen.orientation.lock('landscape').catch(() => {});
					}
				}).catch(() => {});
			}
		} catch (err) {
			console.warn('Tela cheia indisponível:', err);
		}
	}

	botao.addEventListener('click', (event) => {
		event.stopPropagation();
		pediuSozinho = true;
		entrar();
	});
	document.addEventListener('pointerup', (event) => {
		if (!pediuSozinho && event.pointerType !== 'mouse' && !emTelaCheia()) {
			pediuSozinho = true;
			entrar();
		}
	}, true);
	document.addEventListener('fullscreenchange', atualizar);
	document.addEventListener('webkitfullscreenchange', atualizar);
	atualizar();
}());

function iniciarJogo() {
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusLoader = document.getElementById('status-loader');
	const statusText = document.getElementById('status-text');
	const statusFill = document.getElementById('status-fill');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			document.body.classList.remove('loading');
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusLoader.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		let detail = '';
		if (err instanceof Error) {
			detail = err.message;
		} else if (typeof err === 'string') {
			detail = err;
		}
		setStatusNotice('Ops! Não foi possível abrir o jogo.\nTente recarregar a página.' + (detail ? '\n(' + detail + ')' : ''));
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// Instalar o service worker pode resolver o que falta.
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// Às vezes getRegistration() trava.
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Este navegador não tem recursos que o jogo precisa:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.floor((current / total) * 100));
					statusFill.classList.remove('indeterminate');
					statusFill.style.width = pct + '%';
					statusText.textContent = pct >= 100 ? 'Preparando os gatos...' : 'Carregando... ' + pct + '%';
				} else {
					statusFill.classList.add('indeterminate');
					statusFill.style.width = '';
					statusText.textContent = 'Carregando...';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
}
